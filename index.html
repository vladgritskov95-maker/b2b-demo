<title>Bereke B2B — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --line:#E6EBEE; --line2:#D5DEE3;
  --text:#111F2A; --muted:#6B8190; --soft:#8FA3B0;
  --green:#00A859; --green-d:#008B4A; --green-bg:#E8F6EF; --green-line:#B6E3CD;
  --navy:#0F2B3D; --amber:#A96B08; --amber-bg:#FDF4E3;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(17,31,42,.04),0 6px 18px rgba(17,31,42,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071018; --surface:#0E1F2B; --line:#1C3040; --line2:#26404F; --text:#E8F1F6; --muted:#8FA8B7; --soft:#6E8799;
  --green:#00C46A; --green-d:#00A859; --green-bg:#0D2B21; --green-line:#1D4B39; --navy:#081A26;
  --amber:#DFA24C; --amber-bg:#2A2013; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#071018; --surface:#0E1F2B; --line:#1C3040; --line2:#26404F; --text:#E8F1F6; --muted:#8FA8B7; --soft:#6E8799;
  --green:#00C46A; --green-d:#00A859; --green-bg:#0D2B21; --green-line:#1D4B39; --navy:#081A26;
  --amber:#DFA24C; --amber-bg:#2A2013; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}

.app{max-width:540px;margin:0 auto;display:flex;flex-direction:column}

/* ---------- верхняя панель как в продукте ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:8px 12px 6px}
.logo{background:var(--navy);border-radius:11px;padding:8px 11px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.logo .ico{width:20px;height:20px;border-radius:6px;background:var(--green);display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700}
.logo b{color:#fff;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.05;display:block}
.logo b i{color:var(--green);font-style:normal}
.logo span{display:block;font-family:var(--mono);font-size:7.5px;letter-spacing:.18em;color:#7FA0B4;text-transform:uppercase;margin-top:1px}
.tagdemo{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;background:var(--amber-bg);color:var(--amber);padding:4px 7px;border-radius:6px;font-weight:700}
.bell{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;font-size:14px}
.bell i{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--green);color:#fff;font-size:10px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.bell i[hidden]{display:none}
.roles{display:flex;gap:6px;padding:0 12px 8px}
.roles button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px;font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.roles button[aria-pressed="true"]{background:var(--green-bg);border-color:var(--green-line);color:var(--green-d);font-weight:600}

main{padding:12px 12px 96px}

/* панель-заголовок раздела */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.panel::after{content:"";position:absolute;right:-42px;top:-42px;width:130px;height:130px;border-radius:50%;background:var(--green-bg)}
.panel>*{position:relative;z-index:1}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:7px}
.panel h1{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0;display:flex;align-items:center;gap:8px}
.panel h1 em{font-style:normal;color:var(--green)}
.panel p{margin:8px 0 0;font-size:13.5px;color:var(--muted);max-width:44ch}

h2{font-size:15px;font-weight:700;margin:16px 0 8px;letter-spacing:-.01em}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}

/* KPI как в продукте — с цветной верхней кромкой */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi div{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--green);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow)}
.kpi div.b{border-top-color:var(--navy)}
.kpi b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}

/* карточки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:9px;box-shadow:var(--shadow)}
.card.tap{cursor:pointer;transition:transform .15s,border-color .2s}
.card.tap:active{transform:scale(.995)}
.card.acc{border-left:3px solid var(--green)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.meta{font-size:12.5px;color:var(--muted);margin-top:5px}
.badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--green-bg);color:var(--green-d);white-space:nowrap;flex:0 0 auto}
.badge.a{background:var(--amber-bg);color:var(--amber)}
.badge.n{background:var(--bg);color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* кнопки */
.btn{width:100%;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:600;font-size:15px;padding:13px;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.4}
.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--line2);font-weight:500}
.btn.sm{padding:10px;font-size:13.5px}
.btn.dash{background:transparent;border:1px dashed var(--line2);color:var(--muted);font-weight:500}
.btn.nav-link{background:var(--navy);color:#fff}

label.f{display:block;font-size:10.5px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:11px;padding:12px;font-size:15px}
input[type=range]{accent-color:var(--green);padding:0;border:0;background:none}
textarea{min-height:74px;resize:vertical}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.back{background:none;border:0;color:var(--muted);font-size:13px;padding:0 0 8px;cursor:pointer}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:24px 10px;background:var(--surface);border:1px dashed var(--line2);border-radius:14px}
.sep{height:1px;background:var(--line);margin:14px 0}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.list-row:last-child{border-bottom:0}
.list-row span{color:var(--muted)}
.list-row b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.hl{background:var(--navy);color:#fff;border-radius:14px;padding:15px;margin-top:10px}
.hl small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#87AEC4;margin-bottom:5px}
.hl b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hl .m{font-size:12.5px;color:#9FC0D2;margin-top:6px}

/* разбор заявки */
.parse{background:var(--green-bg);border:1px solid var(--green-line);border-radius:14px;padding:14px}
.parse b{font-size:14px;display:block;margin-bottom:4px}
.parse p{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.parse textarea{min-height:60px;background:var(--surface)}
.ex{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ex button{border:1px solid var(--green-line);background:var(--surface);color:var(--green-d);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.fields{display:grid;gap:7px;margin-top:12px}
.fld{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;opacity:.4;transform:translateY(5px);transition:.35s}
.fld.on{opacity:1;transform:none;border-color:var(--green-line)}
.fld span{font-size:10.5px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.fld b{font-size:14px;text-align:right;font-weight:600}
.fld b.no{color:var(--soft);font-weight:400}

/* предложения */
.offer{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;background:var(--surface);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.offer.sel{border-color:var(--green);background:var(--green-bg)}
.offer .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,168,89,.09);transition:width .45s}
.offer>*{position:relative}
.offer .pr{font-family:var(--mono);font-weight:700;color:var(--green-d);font-size:13.5px;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:8px;margin-top:10px}
.stepper button{width:38px;height:38px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:18px;cursor:pointer;color:var(--text)}
.stepper .val{flex:1;text-align:center;font-family:var(--mono);font-weight:700;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:9px 6px;background:var(--bg)}
.check{width:100%;margin-top:8px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:9px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.check.ok{border-color:var(--green-line);background:var(--green-bg);color:var(--green-d);font-weight:600}

.pay{display:grid;gap:7px;margin-top:8px}
.pay button{text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--text)}
.pay button[aria-pressed="true"]{border-color:var(--green);background:var(--green-bg)}
.pay b{font-size:14px;font-weight:600;display:block}
.pay span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.pay .tick{color:var(--green);font-weight:700;font-size:16px}

/* этапы и документы */
.stage{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0}
.stage i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex:0 0 auto;font-style:normal;display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:600}
.stage.done i{background:var(--green);border-color:var(--green);color:#fff}
.stage b{font-size:14px;font-weight:600;display:block}
.stage span{font-size:12.5px;color:var(--muted)}
.doc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc b{font-size:14px;font-weight:500}
.doc button{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:12.5px;cursor:pointer;color:var(--text);white-space:nowrap}
.doc .ok{color:var(--green-d);font-size:12.5px;font-weight:600;white-space:nowrap}

/* метки совпадения */
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;background:var(--green-bg);color:var(--green-d);border-radius:7px;padding:4px 8px;font-weight:600}
.tag.n{background:var(--bg);color:var(--muted);font-weight:400}

/* уведомления */
.note{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 auto;margin-top:6px}
.note i.read{background:var(--line2)}
.note b{font-size:14px;font-weight:600;display:block}
.note span{font-size:12.5px;color:var(--muted)}

/* о платформе */
.acc-item{background:var(--surface);border:1px solid var(--line);border-radius:13px;margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow)}
.acc-item>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:14px;cursor:pointer;text-align:left;color:var(--text)}
.acc-item>button b{font-size:14.5px;font-weight:600}
.acc-item>button i{font-style:normal;color:var(--green);font-size:19px;transition:transform .25s;flex:0 0 auto}
.acc-item.open>button i{transform:rotate(45deg)}
.acc-item p{margin:0;padding:0 14px 14px;font-size:13.5px;color:var(--muted)}
.price3{display:grid;gap:8px;margin-top:10px}
.price3 div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
.price3 div.us{background:var(--green);border-color:var(--green);color:#fff}
.price3 b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em}
.price3 span{font-size:12.5px;color:var(--muted);display:block;margin-top:4px}
.price3 .us span{color:rgba(255,255,255,.85)}

/* нижняя навигация */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:540px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));display:flex}
.nav button{flex:1;border:0;background:none;padding:6px 2px;font-size:10.5px;color:var(--muted);cursor:pointer;display:grid;gap:3px;justify-items:center;border-radius:10px}
.nav button em{font-style:normal;font-size:16px;line-height:1}
.nav button[aria-current="true"]{color:var(--green-d);font-weight:600}

.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:84px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:.28s;max-width:min(460px,92vw);box-shadow:0 12px 30px rgba(0,0,0,.24)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(6,20,30,.5);z-index:70;display:grid;place-items:end center}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto}
.paper{border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12.5px;background:var(--bg)}
.paper .t{font-weight:700;font-size:14px;margin-bottom:8px}
.paper table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.paper td{padding:5px 0;border-bottom:1px solid var(--line)}
.paper td:last-child{text-align:right;font-family:var(--mono)}
.sign{margin-top:10px;font-size:11px;color:var(--muted);font-family:var(--mono)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>

<div class="app">
  <header class="top">
    <div class="top-in">
      <div class="logo"><span class="ico">₸</span><span><b>Bereke <i>B2B</i></b><span>биржа закупок</span></span></div>
      <span class="tagdemo">ДЕМО</span>
      <button class="bell" id="bell" aria-label="Уведомления">🔔<i id="bellN" hidden>0</i></button>
    </div>
    <div class="roles">
      <button type="button" id="rBuyer" aria-pressed="true">🛒 Заказчик</button>
      <button type="button" id="rSeller" aria-pressed="false">📦 Поставщик</button>
    </div>
  </header>
  <main id="app"></main>
  <nav class="nav" id="nav"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var F=new Intl.NumberFormat('ru-RU');
  function money(v){return F.format(Math.round(v))+' ₸'}
  function num(v){return F.format(Math.round(v))}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var PHONE='77052151127';

  var TERMS=[{l:'Прямая оплата',s:'без удорожания',rate:0,m:0},
             {l:'Овердрафт 30 дней',s:'удорожание 1,0 %',rate:.01,m:1},
             {l:'Факторинг 3 месяца',s:'удорожание 2,4 %',rate:.024,m:3},
             {l:'Факторинг 6 месяцев',s:'удорожание 4,9 %',rate:.049,m:6}];

  var S={
    role:'buyer', screen:'exchange', sel:null, notes:[], unread:0, cart:[],
    checkout:{term:2,dp:20}, rawText:'',
    form:{name:'',cat:'Стройматериалы',vol:'',unit:'шт',reg:'',due:''},
    rfqs:[
      {id:'r1',name:'Цемент М400',cat:'Стройматериалы',vol:400,unit:'т',reg:'Алматы',due:'до 30.10.2026',status:'collecting',
       offers:[{co:'ТОО «ТаразПак»',price:31000,cap:220,days:14,del:'самовывоз',rate:'★ 4,6 · 12 сделок',bnpl:true,take:0,checked:false},
               {co:'ТОО «МеталлТрейд KZ»',price:34500,cap:180,days:10,del:'доставка',rate:'★ 4,2 · 7 сделок',bnpl:true,take:0,checked:false},
               {co:'ТОО «КазСтройРесурс»',price:36000,cap:120,days:7,del:'доставка',rate:'новый поставщик',bnpl:false,take:0,checked:false}]},
      {id:'r2',name:'Капитальный ремонт офиса',cat:'Ремонт и отделка',vol:250,unit:'м²',reg:'Астана',due:'до 15.11.2026',status:'ordered',offers:[]}
    ],
    orders:[{id:'o1',name:'Капитальный ремонт офиса',co:'ТОО «МеталлТрейд KZ»',sum:6000000,pay:'Прямая оплата',
      stages:[{n:'Аванс 30 %',s:1800000,done:true},{n:'Выполнение 40 %',s:2400000,done:false},{n:'Финальная приёмка 30 %',s:1800000,done:false}],
      docs:{dog:true,spec:true,esf:false}}],
    incoming:[
      {id:'i1',name:'Кладка стен из кирпича или блоков',cat:'Строительно-монтажные работы',vol:400,unit:'м³',reg:'Астана',co:'ТОО «АгроХим Актобе»',due:'до 13.10.2026',match:['точное совпадение','ваш регион','объём в диапазоне'],answered:false},
      {id:'i2',name:'Цемент М300',cat:'Стройматериалы',vol:150,unit:'т',reg:'Алматы',co:'ТОО «СтройДом KZ»',due:'до 28.09.2026',match:['точное совпадение','объём в диапазоне'],answered:false},
      {id:'i3',name:'Дизельное топливо',cat:'ГСМ',vol:1000,unit:'л',reg:'Костанай',co:'ТОО «Нефтепродукт Ко»',due:'до 01.10.2026',match:['смежная категория'],answered:false}
    ],
    demand:[
      {n:'Цемент М300',c:'Стройматериалы',v:150,u:'т',r:'Алматы'},
      {n:'Арматура А500С, 12 мм',c:'Стройматериалы',v:40,u:'т',r:'Костанай'},
      {n:'Дизельное топливо',c:'ГСМ',v:2000,u:'л',r:'Караганда'},
      {n:'Косметический ремонт офиса',c:'Ремонт и отделка',v:150,u:'м²',r:'СКО'},
      {n:'Обслуживание вентиляции',c:'Техобслуживание',v:12,u:'мес',r:'Караганда'},
      {n:'Круглосуточная охрана объекта',c:'Охрана',v:12,u:'мес',r:'Атырау'}
    ]
  };

  var app=document.getElementById('app'), nav=document.getElementById('nav');
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},2500)}
  function notify(t,s){S.notes.unshift({t:t,s:s,new:true});S.unread++;bellPaint();toast(t)}
  function bellPaint(){var b=document.getElementById('bellN');if(S.unread){b.hidden=false;b.textContent=S.unread}else b.hidden=true}

  // ориентировочная рыночная цена за единицу — чтобы суммы в демо выглядели реально
  var PRICE=[[/цемент/i,31000],[/арматур/i,340000],[/щебен|песок/i,9000],[/кирпич|блок/i,180],
             [/дизел|солярк/i,315],[/бензин/i,285],[/селитр|удобрен|аммофос/i,185000],
             [/кладк/i,14000],[/ремонт|отделк/i,26000],[/вентиляц|обслуживан/i,180000],
             [/охран/i,420000],[/перевоз|доставк|логистик/i,95000]];
  var BYUNIT={'т':85000,'кг':900,'л':320,'м²':24000,'м³':30000,'шт':12000,'мес':350000};
  function unitPrice(name,unit){
    for(var i=0;i<PRICE.length;i++)if(PRICE[i][0].test(name))return PRICE[i][1];
    return BYUNIT[unit]||12000;
  }
  function publishRfq(r,quiet){
    S.rfqs.unshift(r);
    var base=unitPrice(r.name,r.unit);
    var st=base>50000?500:(base>5000?100:(base>500?10:1));
    function pr(k){return Math.round(base*k/st)*st}
    var pool=[
      {co:'ТОО «ТаразПак»',price:pr(.94),cap:Math.ceil(r.vol*.55),days:14,del:'самовывоз',rate:'★ 4,6 · 12 сделок',bnpl:true,take:0,checked:false},
      {co:'ТОО «МеталлТрейд KZ»',price:pr(1.05),cap:Math.ceil(r.vol*.45),days:10,del:'доставка',rate:'★ 4,2 · 7 сделок',bnpl:true,take:0,checked:false},
      {co:'ТОО «КазСтройРесурс»',price:pr(1.12),cap:Math.ceil(r.vol*.3),days:7,del:'доставка',rate:'новый поставщик',bnpl:false,take:0,checked:false}
    ];
    if(!quiet)notify('Заявка опубликована','«'+r.name+'» отправлена 3 профильным поставщикам');
    pool.forEach(function(o,k){
      setTimeout(function(){
        r.offers.push(o);
        notify('Новое предложение',o.co+' · '+num(o.price)+' ₸ за '+r.unit);
        if((S.screen==='rfqwait'||S.screen==='rfq')&&S.sel===r.id)render();
      },1500+k*1600);
    });
    return r;
  }

  var CATS=[
    {c:'Стройматериалы',w:['цемент','арматур','кирпич','блок','щебен','песок','бетон','шифер','профнастил','доск','фанер','утеплит','гипсокартон','труб','плитк','краск']},

    {c:'Сельхозхимия и удобрения',w:['селитр','удобрен','сзр','гербицид','аммофос','семен']},
    {c:'Спецодежда и СИЗ',w:['спецодежд','сиз','перчатк','каск','ботинк','респиратор']},
    {c:'Канцелярия и хозтовары',w:['канцеляр','бумаг','картридж','хозтовар','моющ']},
    {c:'Мебель и оборудование',w:['мебел','стол','стул','шкаф','оборудован','станок','насос']},
    {c:'Строительно-монтажные работы',w:['кладк','монтаж','строительн','фундамент','кровл','сварк','бетонн']},
    {c:'Ремонт и отделка',w:['ремонт','отделк','покраск','штукатур','напольн']},
    {c:'Техобслуживание',w:['обслуживан','вентиляц','кондиционер','сервис','наладк']},
    {c:'Клининг и уборка',w:['уборк','клининг','химчистк','мойк']},
    {c:'Грузоперевозки и логистика',w:['перевоз','доставк','логистик','фура','тягач','экспедиц']},
    {c:'Охрана объектов',w:['охран','видеонаблюден','сигнализац']}
  ];
  var CATLIST=CATS.map(function(c){return c.c}).concat(['Прочее']);
  var UNITLIST=['т','кг','л','м²','м³','м','шт','лист','компл','мес','км'];
  var CITIES=['Алматы','Астана','Шымкент','Костанай','Караганда','Актобе','Павлодар','Атырау','Тараз','Семей','Актау','Уральск','Кокшетау','Петропавловск','Талдыкорган','Туркестан','Кызылорда','Усть-Каменогорск'];
  var UNITS=[{u:'т',w:['тонн','тн','т']},{u:'кг',w:['килограмм','кг']},{u:'л',w:['литр','л']},
             {u:'м²',w:['м2','м²','кв']},{u:'м³',w:['м3','м³','куб']},{u:'м',w:['погонн','метр','пм','м']},
             {u:'шт',w:['штук','шт','единиц']},{u:'лист',w:['лист']},{u:'компл',w:['комплект','компл']},
             {u:'мес',w:['месяц','мес']},{u:'км',w:['км','километр']}];
  function parseRfq(t){
    var src=t.replace(/ /g,' ');
    var s=src.toLowerCase(), out={};

    CATS.forEach(function(c){if(!out.cat)c.w.forEach(function(w){if(!out.cat&&s.indexOf(w)>-1)out.cat=c.c})});
    CITIES.forEach(function(c){if(!out.reg&&s.indexOf(c.toLowerCase().slice(0,Math.max(5,c.length-2)))>-1)out.reg=c});

    var mv=s.match(/(\d[\d\s]{0,9})\s*(тонн[а-я]*|тн|килограмм[а-я]*|кг|литр[а-я]*|м2|м²|кв\.?\s?м[а-я]*|м3|м³|куб[а-я]*|погонн[а-я]*|метр[а-я]*|пм|штук[а-я]*|шт|единиц[а-я]*|лист[а-я]*|комплект[а-я]*|компл|месяц[а-я]*|мес|километр[а-я]*|км|т|л|м)(?![а-яa-z])/);
    if(mv){
      out.vol=parseInt(mv[1].replace(/\s/g,''),10);
      var token=mv[2], best=0;
      UNITS.forEach(function(u){u.w.forEach(function(w){
        if(token.indexOf(w)===0&&w.length>best){best=w.length;out.unit=u.u}
      })});
      if(!out.unit)out.unit='шт';
    }

    // наименование — всё до первого распознанного объёма, иначе до первой запятой
    var cut=mv?mv.index:-1;
    var name=(cut>0?src.slice(0,cut):src.split(/[,;]/)[0]).replace(/[\s,;·-]+$/,'').trim();
    if(name.length>54)name=name.slice(0,54).replace(/\s\S*$/,'');
    if(name)out.name=name.charAt(0).toUpperCase()+name.slice(1);

    // срок: «до 20.10.2026», «до конца месяца», «через 3 дня», «за неделю»
    var md=s.match(/до\s+(конца\s+месяца|конца\s+недели|\d{1,2}[.\s/]\d{1,2}[.\s/]?\d{0,4}|\d{1,2}\s+[а-я]+)/);
    if(md)out.due='до '+md[1].trim();
    else{
      var mc=s.match(/через\s+(\d{1,3})\s*(дн|недел|мес)/);
      if(mc){
        var n=parseInt(mc[1],10), mult=mc[2]==='недел'?7:(mc[2]==='мес'?30:1);
        var d=new Date(); d.setDate(d.getDate()+n*mult);
        out.due='до '+d.toLocaleDateString('ru-RU');
      }
    }
    return out;
  }

  AFTER['rfq']=function(){
    var r=S.rfqs.filter(function(x){return x.id===S.sel})[0]; if(!r)return;
    var step=Math.max(1,Math.round(r.vol*.1));
    function left(){return r.vol-r.offers.reduce(function(a,o){return a+o.take},0)}
    app.querySelectorAll('[data-inc]').forEach(function(b){b.onclick=function(){
      var o=r.offers[+b.dataset.inc]; o.take=Math.min(o.cap,o.take+Math.min(step,Math.max(0,left()))); render()}});
    app.querySelectorAll('[data-dec]').forEach(function(b){b.onclick=function(){
      var o=r.offers[+b.dataset.dec]; o.take=Math.max(0,o.take-step); render()}});
    app.querySelectorAll('[data-check]').forEach(function(b){b.onclick=function(){
      var o=r.offers[+b.dataset.check]; if(o.checked)return;
      b.textContent='Проверяем по реестрам…';
      setTimeout(function(){o.checked=true;render();toast('✓ '+o.co+': компания действующая, в стоп-листах не числится')},900);
    }});
    var a=document.getElementById('auto');
    if(a)a.onclick=function(){
      var order=r.offers.map(function(o,i){return i}).sort(function(x,y){return r.offers[x].price-r.offers[y].price});
      r.offers.forEach(function(o){o.take=0});
      var rest=r.vol; order.forEach(function(i){var o=r.offers[i];o.take=Math.min(o.cap,rest);rest-=o.take});
      render(); toast('Объём разложен по лучшей цене');
    };
    var t=document.getElementById('toCheckout');
    if(t)t.onclick=function(){go('checkout',r.id)};

      function done(){self.textContent='Скопировано';setTimeout(function(){self.textContent='Скопировать ответ'},1500)}
      try{navigator.clipboard.writeText(s).then(done,fb)}catch(e){fb()}
      function fb(){var ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(err){}document.body.removeChild(ta)}
    };
  };

  SCREENS.notes=function(){
    if(!S.notes.length)return '<div class="panel"><span class="eyebrow">Уведомления</span><h1>Пока пусто</h1></div>';
    return '<div class="panel"><span class="eyebrow">Уведомления</span><h1>Что происходило</h1></div>'+
      '<div class="card">'+S.notes.map(function(n){
        return '<div class="note"><i class="'+(n.new?'':'read')+'"></i><div><b>'+esc(n.t)+'</b><span>'+esc(n.s)+'</span></div></div>'}).join('')+'</div>';
  };

  function openDoc(kind,o){
    var m=document.createElement('div'); m.className='modal';
    var title=kind==='spec'?'Спецификация':'Счёт-фактура (ЭСФ)';
    m.innerHTML='<div class="sheet"><h2 style="margin-top:0">'+title+'</h2><div class="paper"><div class="t">'+title+' № 2026-'+String(o.id).slice(-4)+'</div>'+
      '<table><tr><td>Заказчик</td><td>ИП «Глория»</td></tr><tr><td>Поставщик</td><td>'+esc(o.co)+'</td></tr>'+
      '<tr><td>Предмет</td><td>'+esc(o.name)+'</td></tr><tr><td>Сумма с НДС</td><td>'+money(o.sum)+'</td></tr>'+
      '<tr><td>в т.ч. НДС 16 %</td><td>'+money(o.sum*0.16/1.16)+'</td></tr><tr><td>Оплата</td><td>'+esc(o.pay)+'</td></tr></table>'+
      '<div class="sign">Подписано в системе · отпечаток 8BD1231B4E3CDF463245E · 26.09.2026</div></div>'+
      '<button class="btn sec" id="closeDoc">Закрыть</button></div>';
    document.body.appendChild(m);
    m.onclick=function(e){if(e.target===m||e.target.id==='closeDoc')document.body.removeChild(m)};
  }

  app.addEventListener('click',function(e){var t=e.target.closest('[data-go]');if(t)go(t.dataset.go,t.dataset.id)});
  function render(){
    // как только пришли все предложения — заявка перестаёт быть «в ожидании»
    if(S.screen==='rfqwait'){
      var w=S.rfqs.filter(function(x){return x.id===S.sel})[0];
      if(w&&w.offers.length>=3)S.screen='rfq';
    }
    navPaint();
    var f=SCREENS[S.screen]; app.innerHTML=f?f():'';
    if(AFTER[S.screen])AFTER[S.screen]();
  }

  S.notes.push({t:'Добро пожаловать в демо',s:'Опубликуйте заявку и посмотрите, как отвечают поставщики',new:true});
  S.unread=1; bellPaint(); render();
})();
</script>
